name: Build isolated iPad Metal self-test
on:
  workflow_dispatch:
    inputs:
      game:
        description: Compatibility input for the registered workflow
        required: true
        type: choice
        options: [party]
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compile synthetic iOS Metal framework
        run: python3 ci/build_native_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-metal-self-test
          path: native-probe-unsigned.zip
