name: Rebuild existing library games using NX2Apple v1.5.0
run-name: ${{ inputs.game }} on the NX2Apple v1.5.0 engine
on:
  workflow_dispatch:
    inputs:
      game:
        description: Game framework and shaders to rebuild
        required: true
        type: choice
        options: [odyssey, party, zelda]
permissions:
  contents: read
concurrency:
  group: nx2apple-v150-${{ inputs.game }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PRIVATE_REPO: mitu810/switch-ipa-builder
      BUILD_GAME: ${{ inputs.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NX2Apple with Switch 2 support
        uses: actions/checkout@v4
        with:
          repository: LNPANDY/NX2Apple
          ref: f82be32dd41cbb167b66d8a85cedab947415f81b
          path: nx2apple
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare build tools and disk space
        run: |
          test -d /Applications/Xcode_27.2.app
          for unused_xcode in /Applications/Xcode*.app; do
            [ "$unused_xcode" != /Applications/Xcode_27.2.app ] || continue
            if [ -d "$unused_xcode" ] || [ -L "$unused_xcode" ]; then
              sudo rm -rf "$unused_xcode"
            fi
          done
          sudo ln -sfn /Applications/Xcode_27.2.app /Applications/Xcode.app
          xcrun simctl delete all || true
          xcrun simctl runtime delete all || true
          brew install xcodegen zstd glslang spirv-cross sevenzip
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 'capstone>=5,<6' fonttools nsz zbic backports.zstd
          sudo xcodebuild -runFirstLaunch
          xcodebuild -downloadComponent MetalToolchain
          python3 nx2apple/tools/engine.py sync
          git -C nx2apple/engine submodule update --init --recursive
          df -h .
      - name: Build game framework and publish privately
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python3 ci/build_games_v150.py
