name: Build isolated Bananza host candidate
on:
  workflow_dispatch:
    inputs:
      game:
        type: choice
        required: true
        options: [party]
permissions:
  contents: read
concurrency:
  group: nx2apple-bananza-frame-step
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PRIVATE_REPO: mitu810/switch-ipa-builder
      BUILD_GAME: bananza
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LNPANDY/NX2Apple
          ref: 229a6e782bf4299890a59b384fe65b8516dde673
          path: nx2apple
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned host build
        run: |
          brew install xcodegen zstd
          python3 -m pip install lz4 'capstone>=5,<6' fonttools backports.zstd 'unicorn>=2.1,<3'
          sudo xcodebuild -runFirstLaunch
          xcodebuild -downloadComponent MetalToolchain
          python3 nx2apple/tools/engine.py sync
          git -C nx2apple/engine submodule update --init --recursive
      - name: Build frame-step adapter and validate execution
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python3 ci/build_host_candidate.py
