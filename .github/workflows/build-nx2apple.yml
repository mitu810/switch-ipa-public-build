name: Build NX2Apple v1.5.0 shared iPad shell
on:
  workflow_dispatch:
    inputs:
      game:
        required: true
        type: choice
        options: [party]
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PRIVATE_REPO: mitu810/switch-ipa-builder
      BUILD_GAME: bananza
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LNPANDY/NX2Apple
          ref: f82be32dd41cbb167b66d8a85cedab947415f81b
          path: nx2apple
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the official shell sources
        run: |
          brew install xcodegen
          python3 -m pip install fonttools
          sudo xcodebuild -runFirstLaunch
          python3 nx2apple/tools/engine.py sync
      - name: Build and verify the shell
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python3 ci/build_v150_shell.py
