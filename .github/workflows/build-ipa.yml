name: Build Switch Game IPA (public workflow, private assets)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Private ROM release tag'
        required: false
        default: 'rom-zelda-botw'
        type: string
      ipa_tag:
        description: 'Private release tag for the split IPA'
        required: false
        default: 'ipa-botw-1.9.0-separate'
        type: string
      game_name:
        description: 'Game folder name'
        required: false
        default: 'Zelda_BOTW'
        type: string

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: xcode-27
    timeout-minutes: 300

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PRIVATE_REPO: mitu810/switch-ipa-builder

    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: dd8eb14a923a2477ec613cff13ed74b5b931e470
          submodules: recursive

      - name: Free disk space
        run: |
          df -h /
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          for x in \
            /Applications/Xcode_27.app /Applications/Xcode_27.0.app /Applications/Xcode_27.0.0.app \
            /Applications/Xcode_27.1.app /Applications/Xcode_27.1.0.app; do
            if [ -d "$x" ] || [ -L "$x" ]; then echo "删除 $x"; sudo rm -rf "$x"; fi
          done
          sudo ln -sfn /Applications/Xcode_27.2.app /Applications/Xcode.app
          df -h /

      - name: Install Homebrew toolchain
        run: |
          brew install xcodegen zstd glslang aria2
          brew install --cask dotnet-sdk

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Download Xcode Metal toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -downloadComponent metalToolchain || xcodebuild -downloadComponent MetalToolchain || true

      - name: Download private ROM assets and keys
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p "games/${{ inputs.game_name }}" keys
          cd "games/${{ inputs.game_name }}"
          gh release download "${{ inputs.release_tag }}" --pattern "*.part_*" --repo "${{ env.PRIVATE_REPO }}"
          echo "正在合并基础游戏分卷..."
          cat *.part_* > base.nsp
          rm -f *.part_*
          gh release download "${{ inputs.release_tag }}" --pattern "*.nsp" --repo "${{ env.PRIVATE_REPO }}"
          gh release download "${{ inputs.release_tag }}" --pattern "prod.keys" --repo "${{ env.PRIVATE_REPO }}"
          mv prod.keys ../../keys/prod.keys
          ls -lh *.nsp ../../keys/prod.keys
          cd ../..

      - name: Build IPA (M4 g16g, 1.9.0 + DLC)
        run: |
          set +e
          GAME_DIR="games/${{ inputs.game_name }}"
          (
            img=""
            tries=0
            while [ -z "$img" ] || [ ! -s "$img" ]; do
              tries=$((tries + 1))
              [ "$tries" -gt 45 ] && exit 0
              sleep 20
              img=$(ls -d "$GAME_DIR"/*_build/extract/*/RomFS.img 2>/dev/null | head -1)
            done
            last=0
            while :; do
              cur=$(stat -f %z "$img" 2>/dev/null || echo 0)
              if [ "$cur" -gt 0 ] && [ "$cur" -eq "$last" ]; then break; fi
              last=$cur
              sleep 20
            done
            rm -f "$GAME_DIR"/base.nsp "$GAME_DIR"/update.nsp
            echo "[watchdog] 已删除 base.nsp / update.nsp，释放磁盘空间（DLC 保留给解包阶段）"
          ) &
          python3 scripts/build_ipa_from_nsp.py "games/${{ inputs.game_name }}" -k keys/prod.keys --allow-other-metal --gpu g16g --romfs separate
          rc=$?
          wait 2>/dev/null || true
          exit $rc

      - name: Upload small IPA and RomFS to private release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          IPA=$(ls -1 *.ipa games/*/*.ipa 2>/dev/null | head -1)
          ROMFS=$(find games -path '*_build/extract/*/RomFS.img' -type f 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "::error::no IPA found"; exit 1; fi
          if [ -z "$ROMFS" ]; then echo "::error::no RomFS.img found"; exit 1; fi
          ls -lh "$IPA" "$ROMFS"
          # Keep extract/ (it holds RomFS.img); everything else in the build
          # folder and the source NSPs can be removed to make upload room.
          rm -rf games/*/*_build/shader games/*/*_build/ipa games/*/*_build/tmp \
            games/*/*_build/logs games/*/*_build/aoc games/*/*_build/patched_* || true
          rm -f games/*/*.nsp || true
          df -h /
          gh release view "${{ inputs.ipa_tag }}" --repo "${{ env.PRIVATE_REPO }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.ipa_tag }}" --repo "${{ env.PRIVATE_REPO }}" \
              --title "IPA + RomFS: Zelda BOTW 1.9.0 + DLC" \
              --notes "Built by public workflow run ${{ github.run_id }}"
          CHUNK=$((1800 * 1024 * 1024))
          BLOCK=$((1024 * 1024))
          upload_chunks() {
            file="$1"
            prefix="$2"
            total=$(stat -f %z "$file")
            count=$(( (total + CHUNK - 1) / CHUNK ))
            i=0
            while [ "$i" -lt "$count" ]; do
              skip=$(( i * CHUNK / BLOCK ))
              blocks=$(( CHUNK / BLOCK ))
              part=$(printf "%s.part_%02d" "$prefix" "$i")
              dd if="$file" of="$part" bs="$BLOCK" skip="$skip" count="$blocks" 2>/dev/null
              gh release upload "${{ inputs.ipa_tag }}" "$part" --repo "${{ env.PRIVATE_REPO }}" --clobber
              rm -f "$part"
              i=$((i + 1))
            done
          }
          upload_chunks "$IPA" ipa
          upload_chunks "$ROMFS" romfs
          echo "上传完成: ${{ inputs.ipa_tag }}"

      - name: Clean up
        if: always()
        run: |
          rm -f ipa.part_* romfs.part_* || true
